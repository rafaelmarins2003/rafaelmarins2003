<svg viewBox="0 0 1280 400" width="1280" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rafael Marins Florenzano — AI and Data Engineer">
  <title>Rafael Marins Florenzano — AI &amp; Data Engineer</title>
  <desc>A BPMN process diagram: start event flows into a task named Rafael Marins Florenzano, through a parallel gateway into AI Systems, Data Platforms and Research, converging on an end event.</desc>
  <defs>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#223046"/>
    </pattern>
    <radialGradient id="warmglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6A3D" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="398" rx="20"/></clipPath>
  </defs>
  <style>
    .flow { stroke:#FF6A3D; stroke-width:2; fill:none; stroke-dasharray:5 9; stroke-linecap:round;
            animation:flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-28; } }
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.12;} 50%{opacity:.45;} }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation:none; } }
  </style>

  <rect x="1" y="1" width="1278" height="398" rx="20" fill="#0A0F1C" stroke="#1C2637" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1278" height="398" fill="url(#dotgrid)"/>
    <ellipse cx="450" cy="204" rx="340" ry="140" fill="url(#warmglow)"/>
  </g>

  <!-- opening tag -->
  <text x="56" y="62" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="0.3">
    <tspan fill="#5E6C82">&lt;bpmn:process </tspan><tspan fill="#93A1B5">id=</tspan><tspan fill="#FF6A3D">"rafael.marins"</tspan><tspan fill="#93A1B5"> isExecutable=</tspan><tspan fill="#FF6A3D">"true"</tspan><tspan fill="#5E6C82">&gt;</tspan>
  </text>

  <!-- base edges (orthogonal, BPMN-style) -->
  <g stroke="#3A4A63" stroke-width="2" fill="none">
    <path d="M121,204 H162"/>
    <path d="M731,204 H774"/>
    <path d="M812,174 V120 H908"/>
    <path d="M842,204 H908"/>
    <path d="M812,234 V288 H908"/>
    <path d="M1172,120 H1196 V204"/>
    <path d="M1172,288 H1196 V204"/>
    <path d="M1172,204 H1199"/>
  </g>
  <!-- animated token flow -->
  <g>
    <path class="flow" d="M121,204 H162"/>
    <path class="flow" d="M731,204 H774"/>
    <path class="flow" d="M812,174 V120 H908"/>
    <path class="flow" d="M842,204 H908"/>
    <path class="flow" d="M812,234 V288 H908"/>
    <path class="flow" d="M1172,120 H1196 V204 H1199"/>
    <path class="flow" d="M1172,288 H1196 V204 H1199"/>
    <path class="flow" d="M1172,204 H1199"/>
  </g>
  <!-- arrowheads -->
  <g fill="#3A4A63">
    <polygon points="170,204 160,199 160,209"/>
    <polygon points="782,204 772,199 772,209"/>
    <polygon points="916,120 906,115 906,125"/>
    <polygon points="916,204 906,199 906,209"/>
    <polygon points="916,288 906,283 906,293"/>
    <polygon points="1207,204 1197,199 1197,209"/>
  </g>

  <!-- start event -->
  <circle class="pulse" cx="104" cy="204" r="26" fill="none" stroke="#FF6A3D" stroke-width="1.5"/>
  <circle cx="104" cy="204" r="17" fill="#101828" stroke="#93A1B5" stroke-width="2"/>
  <circle cx="104" cy="204" r="4.5" fill="#FF6A3D"/>

  <!-- main task: the name -->
  <rect x="170" y="142" width="560" height="124" rx="16" fill="#101828" stroke="#3A4A63" stroke-width="1.5"/>
  <text x="450" y="201" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="800" fill="#EDF2F9" letter-spacing="1">RAFAEL MARINS FLORENZANO</text>
  <text x="450" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#FF6A3D" letter-spacing="5">AI &amp; DATA ENGINEER</text>

  <!-- parallel gateway -->
  <polygon points="812,174 842,204 812,234 782,204" fill="#101828" stroke="#3A4A63" stroke-width="1.5"/>
  <g stroke="#FF6A3D" stroke-width="2.4" stroke-linecap="round">
    <line x1="812" y1="193" x2="812" y2="215"/>
    <line x1="801" y1="204" x2="823" y2="204"/>
  </g>

  <!-- track nodes -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect x="920" y="92" width="252" height="56" rx="10" fill="#101828" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="946" y="117" font-size="15" font-weight="700" fill="#EDF2F9" letter-spacing="1">AI SYSTEMS</text>
    <text x="946" y="136" font-size="11.5" fill="#93A1B5">llm · rag · agents · eval</text>

    <rect x="920" y="176" width="252" height="56" rx="10" fill="#101828" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="946" y="201" font-size="15" font-weight="700" fill="#EDF2F9" letter-spacing="1">DATA PLATFORMS</text>
    <text x="946" y="220" font-size="11.5" fill="#93A1B5">clickhouse · airflow · dbt</text>

    <rect x="920" y="260" width="252" height="56" rx="10" fill="#101828" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="946" y="285" font-size="15" font-weight="700" fill="#EDF2F9" letter-spacing="1">RESEARCH</text>
    <text x="946" y="304" font-size="11.5" fill="#93A1B5">post-training · dsl · bpmn</text>
  </g>

  <!-- end event (thick border) -->
  <circle cx="1226" cy="204" r="17" fill="#101828" stroke="#FF6A3D" stroke-width="4"/>

  <!-- closing tag + footer -->
  <text x="56" y="364" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#5E6C82">&lt;/bpmn:process&gt;</text>
  <text x="1224" y="364" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5E6C82">fortaleza, br · sr. ai engineer @ vertere ai · comp. eng @ unifor</text>
</svg>
